name: DART 공모주 수집
# 매일 08:00, 14:00 KST (= 23:00, 05:00 UTC)
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '조회만 하고 저장하지 않음'
        type: boolean
        default: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DART 수집
        run: npx tsx scripts/collect-dart.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
